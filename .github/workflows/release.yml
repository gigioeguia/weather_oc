name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión de package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Verificar si se necesita release
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "::error::El tag v${VERSION} ya existe. Incrementa la versión en package.json."
              exit 1
            fi
            echo "El tag v${VERSION} ya existe; no se genera un nuevo release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run build

      - name: Renombrar binario
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            ext=".exe"
          fi
          mv "weather${ext}" "weather-${{ matrix.target }}${ext}"

      - uses: actions/upload-artifact@v4
        with:
          name: weather-${{ matrix.target }}
          path: weather-${{ matrix.target }}*

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          pattern: weather-*
          path: dist
          merge-multiple: true

      - name: Crear tag y release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          files: dist/*
          generate_release_notes: true
